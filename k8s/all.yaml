apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports: [{ containerPort: 6379 }]
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ port: 6379, targetPort: 6379 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: inventory-service }
  template:
    metadata:
      labels: { app: inventory-service }
    spec:
      containers:
        - name: inventory-service
          image: inventory-service:1.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3002 }]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379" }
          readinessProbe:
            httpGet: { path: /health, port: 3002 }
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
spec:
  selector: { app: inventory-service }
  ports: [{ port: 3002, targetPort: 3002 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
spec:
  replicas: 3
  selector:
    matchLabels: { app: booking-service }
  template:
    metadata:
      labels: { app: booking-service }
    spec:
      containers:
        - name: booking-service
          image: booking-service:1.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3001 }]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: INVENTORY_URL, value: "http://inventory-service:3002" }
            - { name: SIMULATED_CPU_MS, value: "30" }
          readinessProbe:
            httpGet: { path: /health, port: 3001 }
          resources:
            requests: { cpu: 100m, memory: 64Mi }
            limits: { cpu: 1000m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: booking-service
spec:
  selector: { app: booking-service }
  ports: [{ port: 3001, targetPort: 3001 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
spec:
  replicas: 1
  selector:
    matchLabels: { app: notification-service }
  template:
    metadata:
      labels: { app: notification-service }
    spec:
      containers:
        - name: notification-service
          image: notification-service:1.0
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3003 }]
          env:
            - { name: REDIS_URL, value: "redis://redis:6379" }
          readinessProbe:
            httpGet: { path: /health, port: 3003 }
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  selector: { app: notification-service }
  ports: [{ port: 3003, targetPort: 3003 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: gateway:1.1
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
            - { name: BOOKING_URL, value: "http://booking-service:3001" }
            - { name: INVENTORY_URL, value: "http://inventory-service:3002" }
            - { name: NOTIFICATION_URL, value: "http://notification-service:3003" }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  type: LoadBalancer
  selector: { app: gateway }
  ports: [{ port: 3000, targetPort: 3000 }]